<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Explore Ocean Science & Surveying's global project portfolio — 100+ engineering and survey projects across 14 services, visualized on an interactive 3D globe.">
    <meta name="keywords"
        content="ocean survey, offshore projects, global map, 3D globe, hydrographic survey, geophysical survey, marine survey, interactive map">
    <meta name="author" content="Ocean Science & Surveying Pvt. Ltd.">
    <title>Global Projects | Ocean Science & Surveying Pvt. Ltd.</title>
    <link rel="icon" type="image/png" href="./IMAGES/company logo/OceanScience-favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Globe.GL (bundles Three.js internally) -->
    <script src="https://unpkg.com/globe.gl@2.35.0/dist/globe.gl.min.js"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="3d-globe.css">
</head>

<body>

    <!-- ─── Loading Screen ─── -->
    <div class="globe-loader" id="globe-loader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Loading Globe</div>
    </div>

    <!-- ─── Star Field Background ─── -->
    <canvas id="star-field"></canvas>

    <!-- ─── Globe Container ─── -->
    <div id="globe-container"></div>

    <!-- ─── Header Bar ─── -->
    <header class="globe-header">
        <div class="header-brand">
            <div class="header-brand-icon">🌊</div>
            <h1>Ocean<span>Science</span> — Global Projects</h1>
        </div>

        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search projects, services, countries…"
                autocomplete="off">
            <button id="search-clear" class="search-clear" title="Clear search">×</button>
        </div>
    </header>

    <!-- ─── Stats Counter ─── -->
    <div class="stats-counter glass-panel" id="stats-counter">
        <span class="stat-number" id="stat-projects">100</span>
        <span>Projects</span>
        <span class="stat-divider"></span>
        <span class="stat-number" id="stat-countries">24</span>
        <span>Countries</span>
    </div>

    <!-- ─── Filter Panel ─── -->
    <aside class="filter-panel glass-panel" id="filter-panel">
        <div class="filter-header">
            <h3>Services</h3>
            <button id="toggle-all-btn" class="filter-toggle-all">Hide All</button>
        </div>
        <div id="filter-list"></div>
    </aside>

    <!-- ─── Reset View Button ─── -->
    <button class="reset-view-btn" id="reset-view-btn" title="Reset globe view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-9 9z" />
            <path d="M3 12h4" />
            <path d="M12 3v4" />
        </svg>
        Reset View
    </button>

    <!-- ─── Mobile Filter Toggle ─── -->
    <button class="mobile-filter-toggle" id="mobile-filter-toggle" title="Toggle filters">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h10M4 18h6" />
        </svg>
    </button>

    <!-- ─── Admin Panel Toggle Button ─── -->
    <button class="admin-toggle-btn glass-panel" id="admin-toggle-btn" title="Project Manager">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        <span>Manage Projects</span>
    </button>

    <!-- ─── Admin Panel Sidebar ─── -->
    <aside class="admin-panel glass-panel" id="admin-panel">
        <div class="admin-header">
            <h3>Project Manager</h3>
            <button id="admin-close-btn" class="admin-close">&times;</button>
        </div>
        
        <div class="admin-body">
            <form id="add-project-form" class="admin-form">
                <h4 class="form-title">Add New Project</h4>
                
                <div class="form-group">
                    <label for="new-project-name">Project Name*</label>
                    <input type="text" id="new-project-name" required placeholder="e.g. Mumbai Offshore Drilling">
                </div>
                
                <div class="form-group">
                    <label for="new-project-service">Service Category*</label>
                    <select id="new-project-service" required></select>
                </div>
                
                <div class="form-group coordinate-group">
                    <div class="coord-label-wrap">
                        <label>Coordinates*</label>
                        <button type="button" id="btn-pick-coords" class="btn-pick">
                            <span>📍 Pick from Globe</span>
                        </button>
                    </div>
                    <div class="coord-inputs">
                        <input type="number" step="any" id="new-project-lat" required placeholder="Latitude">
                        <input type="number" step="any" id="new-project-lng" required placeholder="Longitude">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-project-city">City*</label>
                        <input type="text" id="new-project-city" required placeholder="City">
                    </div>
                    <div class="form-group">
                        <label for="new-project-country">Country*</label>
                        <input type="text" id="new-project-country" required placeholder="Country">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="new-project-client">Client</label>
                        <input type="text" id="new-project-client" placeholder="e.g. ONGC">
                    </div>
                    <div class="form-group">
                        <label for="new-project-year">Year</label>
                        <input type="number" id="new-project-year" placeholder="e.g. 2026">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="new-project-desc">Description*</label>
                    <textarea id="new-project-desc" rows="2" required placeholder="Short description of the project…"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Add Project</button>
            </form>
            
            <div class="admin-divider"></div>
            
            <div class="admin-data-section">
                <h4>Data Management</h4>
                <div class="data-actions">
                    <button type="button" id="btn-export-json" class="btn-data btn-export">
                        <span>📤 Export JSON</span>
                    </button>
                    <label for="import-json-input" class="btn-data btn-import">
                        <span>📥 Import JSON</span>
                        <input type="file" id="import-json-input" accept=".json" style="display:none">
                    </label>
                </div>
                <button type="button" id="btn-reset-data" class="btn-reset-data">
                    Reset to Default Projects
                </button>
            </div>
        </div>
    </aside>

    <!-- ─── Project Detail Card Overlay ─── -->
    <div class="project-card-overlay" id="project-card-overlay">
        <div class="project-card glass-panel">
            <div class="project-card-header">
                <span class="project-card-service" id="card-service">—</span>
                <h2 class="project-card-name" id="card-name">—</h2>
                <div class="project-card-location" id="card-location">—</div>
                <button class="project-card-close" id="card-close-btn" title="Close">×</button>
            </div>
            <div class="project-card-body">
                <p class="project-card-description" id="card-description">—</p>
                <div class="project-card-meta">
                    <div class="meta-item">
                        <div class="meta-item-label">Client</div>
                        <div class="meta-item-value" id="card-client">—</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-item-label">Year</div>
                        <div class="meta-item-value" id="card-year">—</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-item-label">Coordinates</div>
                        <div class="meta-item-value" id="card-coords">—</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-item-label">Category</div>
                        <div class="meta-item-value" id="card-category">—</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ─── Application Script ─── -->
    <script src="3d-globe.js"></script>

</body>

</html>
